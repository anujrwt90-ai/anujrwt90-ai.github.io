<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaHub — Movies, Series & Anime</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#">MEDIA<span>HUB</span></a>
  <nav>
    <a href="#home">Home</a><a href="#movies">Movies</a><a href="#series">Series</a><a href="#anime">Anime</a>
    <a href="admin.html">Admin</a>
  </nav>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">☀</button>
</header>

<main>
<section id="home" class="hero">
  <div>
    <p class="eyebrow">YOUR CONTENT LIBRARY</p>
    <h1>Discover something<br><span>worth watching.</span></h1>
    <p class="hero-copy">Manage and explore your movies, series, anime and other content in one clean dashboard.</p>
    <a class="cta" href="#library">Browse Library →</a>
  </div>
</section>

<section class="toolbar" id="library">
  <input id="search" type="search" placeholder="Search title, genre, year...">
  <select id="typeFilter">
    <option value="all">All content</option><option value="movie">Movies</option>
    <option value="series">Series</option><option value="anime">Anime</option><option value="other">Other</option>
  </select>
  <select id="sort">
    <option value="latest">Latest</option><option value="rating">Top rated</option><option value="title">A–Z</option>
  </select>
</section>

<section class="content-section" id="movies"><div class="section-head"><h2>Movies</h2><span id="movieCount"></span></div><div class="grid" data-grid="movie"></div></section>
<section class="content-section" id="series"><div class="section-head"><h2>Series</h2><span id="seriesCount"></span></div><div class="grid" data-grid="series"></div></section>
<section class="content-section" id="anime"><div class="section-head"><h2>Anime</h2><span id="animeCount"></span></div><div class="grid" data-grid="anime"></div></section>
<section class="content-section" id="other"><div class="section-head"><h2>Other</h2><span id="otherCount"></span></div><div class="grid" data-grid="other"></div></section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div>
<footer>MediaHub v1 · Content catalog & management demo</footer>
<script src="script.js"></script>
</body>
</html>
